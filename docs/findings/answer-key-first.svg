<text x="660" y="410" font-size="13" fill="#172033" font-weight="600" text-anchor="middle" >Use a different model to write the data from the ones you test: GPT-5.4 looked best on its own transcripts, and the lead disappeared on GPT-6 Astra's.</text>
<text x="660" y="434" font-size="12.5" fill="#596579" font-weight="400" text-anchor="middle" >Some nicknames only appear in the test meetings, so the matcher is also tested on words it has never seen.</text>
