<g class="a18"><circle cx="706" cy="320" r="9" fill="#107c41"/><path d="M701 320l3.5 3.5 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="724" y="324" font-size="12" fill="#172033" font-weight="400" text-anchor="start" >blocked on day 2</text></g>
<g class="a19"><text x="696" y="366" font-size="12" fill="#596579" font-weight="600" text-anchor="start" >If not, write it again.</text></g>
<text x="1008" y="206" font-size="11.5" fill="#172033" font-weight="400" text-anchor="start" >jobs and updates found</text>
