  <g fill="#fff" font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="45" font-size="27" font-weight="700">Make the answer key first, then the meeting</text>
    <text x="42" y="72" font-size="14" fill="#b6c5d7">Synthetic stand-ups where we already know the right answer, so every step can be scored. No labelling.</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
