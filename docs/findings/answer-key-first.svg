<g class="a8"><text x="72" y="366" font-size="12" fill="#107c41" font-weight="700" text-anchor="start" >This is the answer key.</text></g>
<text class="a9" x="384" y="220" font-size="11.8" fill="#172033"><tspan font-weight="700" fill="#0f5cc0">Sarah:</tspan> Tom, fire alarm test by Wednesday?</text>
<text class="a10" x="384" y="246" font-size="11.8" fill="#172033"><tspan font-weight="700" fill="#f7630c">Tomasz:</tspan> Yep, I'll do it.</text>
<text class="a11" x="384" y="272" font-size="11.8" fill="#172033"><tspan font-weight="700" fill="#107c41">Hannah:</tspan> I'll book a contractor for the</text>
<text class="a12" x="384" y="298" font-size="11.8" fill="#172033">GT2 water valve.</text>
<text class="a13" x="384" y="324" font-size="11.8" fill="#172033"><tspan font-weight="700" fill="#5c2d91">Olu:</tspan> Anyone see the match last night?</text>
<g class="a14"><text x="384" y="366" font-size="12" fill="#596579" font-weight="600" text-anchor="start" >Chit-chat and nicknames included.</text></g>
