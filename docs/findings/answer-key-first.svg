<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="456" viewBox="0 0 1320 456" role="img" aria-labelledby="title description">
  <title id="title">How the synthetic data gets a free answer key</title>
  <desc id="description">Four cards. 1: a simulator decides what happens first, the answer key: Tomasz does the fire alarm test by Wednesday, Hannah books a contractor for the GT2 valve, on day 2 the test is done and the contractor is blocked. 2: GPT-6 Astra writes a Teams stand-up around it, with chit-chat and nicknames. 3: a validator checks every job is really in the transcript. 4: the pipeline is scored against the known answer: 100% found, right card in the short list 100%, updates exactly right 97%, new jobs with every field right 67%.</desc>
