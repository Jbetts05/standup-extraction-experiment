<text x="760" y="174" font-size="11.5" fill="#596579" font-weight="400" text-anchor="start" >every job must be in the text</text>
<g filter="url(#shadow)"><rect x="988" y="116" width="280" height="262" rx="12" fill="#fff" stroke="#bec7d3" /></g>
<text x="1008" y="148" font-size="15" fill="#172033" font-weight="700" text-anchor="start" >4. Score the pipeline on it</text>
<rect x="1008" y="160" width="54" height="20" rx="5" fill="#e9eef5"/><text x="1035" y="174" font-size="10" fill="#596579" font-weight="700" text-anchor="middle" >CODE</text>
<text x="1072" y="174" font-size="11.5" fill="#596579" font-weight="400" text-anchor="start" >against the known answer</text>
