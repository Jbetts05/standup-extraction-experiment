<rect x="72" y="160" width="54" height="20" rx="5" fill="#e9eef5"/><text x="99" y="174" font-size="10" fill="#596579" font-weight="700" text-anchor="middle" >CODE</text>
<text x="136" y="174" font-size="11.5" fill="#596579" font-weight="400" text-anchor="start" >a simulator, not a model</text>
