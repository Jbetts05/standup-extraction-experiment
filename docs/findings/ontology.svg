<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="566" viewBox="0 0 1320 566" role="img" aria-labelledby="title description">
  <title id="title">How the ontology turns a nickname into an id</title>
  <desc id="description">Left: data/ontology.yaml as a tree. Site Utilities contains Air Compressor 1, known as air compressor or AC1, with the held-out nickname the Atlas; Moulding Hall contains Injection Moulding Line 2, held-out nickname the Arburg. Held-out nicknames only appear in test transcripts. Right: Tomasz says he'll get the Atlas serviced today. The model extracts the words the Atlas, code shortlists four candidates from the ontology with fuzzy matching and embeddings, and the model picks Air Compressor 1, id AIR-C-01; if unsure it names the parent. The best pipeline links machines called by a name in the ontology 100% of the time, and by a never-seen nickname 74%.</desc>
