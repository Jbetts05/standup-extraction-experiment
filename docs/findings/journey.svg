<g class="a5"><g filter="url(#shadow)"><rect x="15" y="172" width="300" height="196" rx="12" fill="#fff" stroke="#bec7d3" /></g><text x="35" y="204" font-size="17" fill="#172033" font-weight="700" text-anchor="start" >Pick a model</text><text x="35" y="234" font-size="12.5" fill="#596579" font-weight="400" text-anchor="start" >Tried 163 ways to pull jobs out</text><text x="35" y="254" font-size="12.5" fill="#596579" font-weight="400" text-anchor="start" >of a transcript. Two small model</text><text x="35" y="274" font-size="12.5" fill="#596579" font-weight="400" text-anchor="start" >calls beat one big one.</text><rect x="35" y="318" width="260" height="24" rx="12" fill="#eef4fb" stroke="#0f5cc0"/><text x="165.0" y="334" font-size="11.5" fill="#0f5cc0" font-weight="700" text-anchor="middle" >GPT-5.6 Luna ×2 · 72% right · $0.005</text></g>
<circle cx="495" cy="138" r="15" fill="#fff" stroke="#bec7d3" stroke-width="3"/>
<text x="495" y="143" font-size="13" fill="#596579" font-weight="700" text-anchor="middle" >2</text>
<g class="a6"><circle cx="495" cy="138" r="15" fill="#0f5cc0"/><text x="495" y="143" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" >2</text></g>
<g class="a7"><g filter="url(#shadow)"><rect x="345" y="172" width="300" height="196" rx="12" fill="#fff" stroke="#bec7d3" /></g><text x="365" y="204" font-size="17" fill="#172033" font-weight="700" text-anchor="start" >Show the working</text><text x="365" y="234" font-size="12.5" fill="#596579" font-weight="400" text-anchor="start" >A click-through report: every</text><text x="365" y="254" font-size="12.5" fill="#596579" font-weight="400" text-anchor="start" >meeting, prompt and result, so</text><text x="365" y="274" font-size="12.5" fill="#596579" font-weight="400" text-anchor="start" >people can check it, not trust it.</text><rect x="365" y="318" width="260" height="24" rx="12" fill="#eef4fb" stroke="#0f5cc0"/><text x="495.0" y="334" font-size="11.5" fill="#0f5cc0" font-weight="700" text-anchor="middle" >report + slide deck</text></g>
<circle cx="825" cy="138" r="15" fill="#fff" stroke="#bec7d3" stroke-width="3"/>
<text x="825" y="143" font-size="13" fill="#596579" font-weight="700" text-anchor="middle" >3</text>
<g class="a8"><circle cx="825" cy="138" r="15" fill="#596579"/><text x="825" y="143" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" >3</text></g>
<g class="a9"><g filter="url(#shadow)"><rect x="675" y="172" width="300" height="196" rx="12" fill="#fff" stroke="#bec7d3" /></g><text x="695" y="204" font-size="17" fill="#172033" font-weight="700" text-anchor="start" >Try an agent?</text><text x="695" y="234" font-size="12.5" fill="#596579" font-weight="400" text-anchor="start" >Designed an agent that fetches</text><text x="695" y="254" font-size="12.5" fill="#596579" font-weight="400" text-anchor="start" >the board with tools. Then parked</text><text x="695" y="274" font-size="12.5" fill="#596579" font-weight="400" text-anchor="start" >it: code can load the board.</text><rect x="695" y="318" width="260" height="24" rx="12" fill="#fff" stroke="#bec7d3" stroke-dasharray="4 4"/><text x="825.0" y="334" font-size="11.5" fill="#596579" font-weight="700" text-anchor="middle" >parked · not needed</text></g>
