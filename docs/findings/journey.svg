<g class="a12" transform="rotate(-8 913 202)"><rect x="861" y="186" width="104" height="30" rx="6" fill="#fff" stroke="#f7630c" stroke-width="2"/><text x="913" y="207" font-size="14" fill="#f7630c" font-weight="800" text-anchor="middle" >PARKED</text></g>
<g class="m13"><circle r="7" fill="#f7630c"/><circle r="12" fill="none" stroke="#f7630c" stroke-opacity=".35" stroke-width="3"/></g>
<g class="a14"><text x="660" y="408" font-size="13.5" fill="#172033" font-weight="600" text-anchor="middle" >What we're sharing: the model experiment, the synthetic data with its answer key, the board pipeline, and the traces that show how every decision was made.</text></g>
