<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="430" viewBox="0 0 1320 430" role="img" aria-labelledby="title description">
  <title id="title">The four approaches, in order</title>
  <desc id="description">Four stations on a line. 1, pick a model: 163 ways tried, two small model calls beat one big one, GPT-5.6 Luna twice gets 72% fully right for half a cent. 2, show the working: a click-through report. 3, try an agent: designed, then parked, because code can load the board. 4, keep the board up to date: extract, pull the cards, pick, rules write it; 97% of updates right for $0.007 a stand-up.</desc>
