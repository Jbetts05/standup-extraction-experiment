    <text x="42" y="45" font-size="27" font-weight="700">What we tried, and what we kept</text>
    <text x="42" y="72" font-size="14" fill="#b6c5d7">Four approaches to one problem: turn stand-up transcripts into a task board that keeps itself up to date.</text>
  </g>
