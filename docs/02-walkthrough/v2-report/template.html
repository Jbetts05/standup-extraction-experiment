function buildScope(scope) {

// A failed extraction call is shared by every pipeline built on it, so count distinct calls, not pipeline rows.
function failures(sc) {

const SORTS = { dr: p => p.dr, d: p => p.vsBase.d, f1: p => p.f1, prec: p => p.prec, rec: p => p.rec, cost: p => p.cost ?? 1e9, secs: p => p.secs ?? 1e9, name: p => pName(p.k) };
function sorted(list) { const f = SORTS[S.sort.k]; return [...list].sort((a, b) => { const x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : 0) * (S.sort.asc ? 1 : -1); }); }
const th = (k, l, cls = "") => `<th data-sort="${k}" class="${cls} ${S.sort.k === k ? "sorted" + (S.sort.asc ? " asc" : "") : ""}">${l}</th>`;
function renderResults() {
  const sc = SC(), rows = sorted(sc.list.filter(p => S.fam === "all" || p.fam === S.fam));
  const score = `<div class="scroll" style="max-height:620px"><table class="t"><tr><th title="Two paired comparisons: against the best pipeline and against the baseline">Verdict</th>${th("name", "Pipeline")}<th style="width:16%">Dashboard-ready · 95% interval</th>${th("dr", "Est.", "num")}
      ${th("d", `Δ vs baseline<div class="tiny soft" style="text-transform:none;letter-spacing:0;font-weight:400;white-space:normal;max-width:170px;margin-left:auto">${esc(pName(sc.base.k))}</div>`, "num")}${th("f1", "Job F1", "num")}${th("prec", "Precision", "num")}${th("rec", "Recall", "num")}${th("cost", "$ / mtg", "num")}${th("secs", "s / mtg", "num")}<th></th></tr>
    ${rows.map(p => `<tr class="${p === sc.rec ? "hl" : ""}"><td>${fGroup(p)}${p === sc.rec ? `<div class="tiny soft">recommended</div>` : ""}</td><td>${pipeCell(p.k)}${p.errors ? `<span class="chip bad" style="margin-top:3px" title="The model call timed out on these meetings; they are scored as found nothing">failed on ${p.errors} of ${sc.meetings} meetings</span>` : ""}</td>
      <td>${forest(p, sc)}</td><td class="num"><b>${pct(p.dr)}</b><div>${ciTxt(p.ci)}</div></td><td class="num">${p === sc.base ? `<span class="soft">—</span>` : dTxt(p.vsBase)}</td>
      <td class="num">${pct(p.f1)}</td><td class="num">${pct(p.prec)}</td><td class="num">${pct(p.rec)}</td><td class="num">${usd(p.cost)}</td><td class="num">${sec(p.secs)}</td>
      <td><button class="btn small" data-cmp="${p.k}" data-cmpb="${(p === sc.best ? sc.base : sc.best).k}" title="Compare job by job">Compare</button></td></tr>`).join("")}</table></div>
    <div class="legend"><span><i style="background:var(--cp-accent)"></i>close to #1</span><span><i style="background:var(--cp-text-muted)"></i>other</span>
      <span><i style="background:transparent;border-left:1px dashed var(--cp-text-soft);border-radius:0"></i>baseline</span><span><i style="background:var(--cp-warning);width:3px"></i>ship bar (${pct(S.bar)})</span></div>`;
  return `<div class="eyebrow">Results · scorecard</div><h1>Every pipeline, measured against a baseline</h1>
  <p class="lede">Primary metric: <b>dashboard-ready</b>, the share of real jobs found with all six fields right. Baseline: <b>${esc(pName(sc.base.k))}</b>, the best no-LLM option at $0.
    The <b>Verdict</b> column combines two paired comparisons: against the best pipeline and against the baseline. <span class="grp top">Close to #1</span> means the data can't tell it apart from the top-scoring pipeline, not that it has been shown to be as good. "Regex" in a verdict always means the baseline above. The recommendation is simply the highest score; cheaper options are shown as trade-offs on the Summary.</p>
  <div class="row" style="margin:14px 0">${famSeg()}<span class="soft small">${rows.length} of ${sc.list.length} pipelines · ${sc.gold} jobs · ${sc.meetings} meetings · click a column to sort</span></div>
  ${score}
  <div class="section"><div class="sh"><h2>Quality against cost</h2><span class="soft small">up = better, left = cheaper · whiskers = 95% interval · filled = close to #1 · click a dot to compare it with the best</span></div>
    <div class="card">${frontierSVG(sc, rows)}<div class="legend">${Object.values(FAM).map(f => `<span><i style="background:${f.c};border-radius:50%"></i>${f.label}</span>`).join("")}</div></div></div>
  <div class="section"><div class="sh"><h2>Where jobs are lost</h2><span class="soft small">outcome of every real job · field columns = % correct among jobs that were found</span></div>${diagTable(sc, rows)}</div>
  <div class="section"><div class="sh"><h2>Matching on its own: known vs unseen nicknames</h2><span class="soft small">each matcher gets the correct words from the answer key, so extraction errors are excluded</span></div>${nickTable(sc)}</div>
  <div class="section"><div class="sh"><h2>Robustness: does the transcript writer matter?</h2></div>${writerCheck()}</div>`;
}
function frontierSVG(sc, rows) {
  const W = 900, H = 380, pad = { l: 52, r: 18, t: 14, b: 40 }, pts_ = rows.filter(p => p.cost != null);
  const pos = pts_.filter(p => p.cost > 0).map(p => p.cost), lx = Math.log10;
  const x0 = lx(pos.length ? Math.min(...pos) / 2 : 0.001), x1 = lx(pos.length ? Math.max(...pos) * 2 : 1), lane = pad.l + 22;
  const X = c => c === 0 ? lane : pad.l + 56 + (lx(c) - x0) / (x1 - x0) * (W - pad.l - 56 - pad.r);
  const ymin = Math.max(0, Math.floor((Math.min(...rows.map(p => p.ci.lo)) - 0.05) * 10) / 10), ymax = Math.min(1, Math.ceil((Math.max(...rows.map(p => p.ci.hi), S.bar) + 0.02) * 10) / 10);
  const Y = v => pad.t + (1 - (v - ymin) / (ymax - ymin)) * (H - pad.t - pad.b);
  const placed = [], POS = {};
  [...pts_].sort((a, b) => a.cost - b.cost || b.dr - a.dr).forEach(p => { let x = X(p.cost); const y = Y(p.dr);
    while (placed.some(q => Math.hypot(q[0] - x, q[1] - y) < 11)) x += 11; placed.push([x, y]); POS[p.k] = x; });
  const XP = p => POS[p.k];
  const yt = []; for (let v = ymin; v <= ymax + 1e-9; v += 0.1) yt.push(v);
  const xt = [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1].filter(c => lx(c) >= x0 && lx(c) <= x1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><g class="gridl">${yt.map(v => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pad.l - 8}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`).join("")}
    ${xt.map(c => `<line x1="${X(c)}" x2="${X(c)}" y1="${pad.t}" y2="${H - pad.b}"/><text x="${X(c)}" y="${H - pad.b + 16}" text-anchor="middle">$${c}</text>`).join("")}</g>
    <text x="${lane}" y="${H - pad.b + 16}" text-anchor="middle">$0</text>
    <line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(sc.base.dr)}" y2="${Y(sc.base.dr)}" stroke="var(--cp-text-soft)" stroke-dasharray="4 4"/><text x="${W - pad.r}" y="${Y(sc.base.dr) - 5}" text-anchor="end">baseline</text>
    ${S.bar >= ymin && S.bar <= ymax ? `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(S.bar)}" y2="${Y(S.bar)}" stroke="var(--cp-warning)" stroke-width="2"/><text x="${W - pad.r}" y="${Y(S.bar) - 5}" text-anchor="end">ship bar ${pct(S.bar)}</text>` : ""}
    ${pts_.map(p => `<line x1="${XP(p)}" x2="${XP(p)}" y1="${Y(p.ci.hi)}" y2="${Y(p.ci.lo)}" stroke="${FAM[p.fam].c}" stroke-opacity=".5" stroke-width="1.5" pointer-events="none"/>`).join("")}
    ${[...pts_].sort((a, b) => (a.group === "top") - (b.group === "top")).map(p => { const x = XP(p), c = FAM[p.fam].c, top = p.group === "top";
      return `<circle class="pt" cx="${x}" cy="${Y(p.dr)}" r="${top ? 6.5 : 5}" fill="${top ? c : "var(--cp-surface)"}" stroke="${c}" stroke-width="2" data-cmp="${p.k}" data-cmpb="${(p === sc.best ? sc.base : sc.best).k}">
      <title>${esc(`${pName(p.k)}\n${pct(p.dr)} (${pct(p.ci.lo)}–${pct(p.ci.hi)}) · ${usd(p.cost)}/meeting · ${sec(p.secs)} · ${GROUPS[p.group].label}`)}</title></circle>`; }).join("")}
    <text x="${W / 2}" y="${H - 6}" text-anchor="middle">cost per meeting (log scale)</text><text transform="translate(12 ${H / 2}) rotate(-90)" text-anchor="middle">dashboard-ready</text></svg>`;
}
const heat = v => v == null ? `<div class="heat soft">–</div>` : `<div class="heat" style="background:color-mix(in srgb, color-mix(in srgb, var(--cp-success) ${Math.round(Math.max(0, (v - 0.5) * 2) * 100)}%, var(--cp-danger)) ${Math.round(Math.abs(v - 0.75) * 60 + 12)}%, transparent)">${pct(v)}</div>`;
function diagTable(sc, rows) {
  const O = [["ready", "all six right", "var(--cp-success)"], ["one", "one field wrong", "var(--cp-warning)"], ["many", "2+ fields wrong", "var(--cp-danger)"], ["missed", "missed", "var(--cp-border-strong)"]];
  return `<div class="scroll" style="max-height:560px"><table class="t compact"><tr><th>Pipeline</th><th style="width:22%">Outcome of each real job</th><th class="num">Found</th>${FIELDS.map(([, l]) => `<th class="num">${l}</th>`).join("")}<th class="num" title="returned jobs that were not real jobs, per meeting">Not real / mtg</th></tr>
    ${[...rows].sort((a, b) => b.dr - a.dr).map(p => { const o = { ready: p.ready, one: p.one, many: p.many, missed: p.gold - p.tp };
      return `<tr><td>${pipeCell(p.k)}</td><td><div class="outcome" title="${esc(O.map(([k, l]) => `${l}: ${o[k]}`).join(" · "))}">${O.map(([k, , c]) => `<i style="width:${100 * o[k] / p.gold}%;background:${c}"></i>`).join("")}</div>
        <div class="tiny soft" style="margin-top:3px">${o.ready} ready · ${o.one} one wrong · ${o.many} 2+ wrong · ${o.missed} missed</div></td>
        <td>${heat(p.rec)}</td>${FIELDS.map(([fk]) => `<td>${heat(p.tp ? p.fields[fk] / p.tp : null)}</td>`).join("")}<td class="num">${((p.ret - p.tp) / sc.meetings).toFixed(1)}</td></tr>`; }).join("")}</table></div>
    <div class="legend">${O.map(([, l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>`;
}
function nickTable(sc) {
  const C = [["component@known", "Equip. known"], ["component@heldout", "Equip. unseen"], ["owner@known", "Person known"], ["owner@heldout", "Person unseen"], ["site@known", "Site known"], ["site@heldout", "Site unseen"], ["category", "Category"], ["priority", "Priority"]];
  const rows = [...sc.norm].sort((a, b) => (b.g("component@heldout") ?? 0) - (a.g("component@heldout") ?? 0));
  const n = sc.norm[0] || { };
  return `<div class="scroll"><table class="t compact"><tr><th>Matcher</th>${C.map(([k, l]) => `<th class="num">${l}<div class="tiny soft" style="text-transform:none">n=${n["n_" + k] ?? "–"}</div></th>`).join("")}<th class="num">$ / mtg</th></tr>
    ${rows.map(r => `<tr><td><b>${esc(noName(r.normaliser))}</b><div class="tiny soft">${esc(noWhere(r.normaliser))}</div></td>${C.map(([k]) => `<td>${heat(r.g(k))}</td>`).join("")}<td class="num">${usd(r.cost)}</td></tr>`).join("")}</table></div>
    <p class="small muted" style="margin-top:8px">Unseen = nicknames kept out of every prompt, vocabulary and training set, which appear only in test meetings. With few unseen mentions per column, treat gaps under ~20 points as noise.</p>`;
}
function writerCheck() {
  const ss = SETS();
  if (ss.length < 2) {
    const all = [...new Set(D.meetings.map(m => m.set))];
    return `<div class="callout warn">Only the <b>${esc(D.sets[ss[0]].label)}</b> test set is scored in this export (${all.length} writer sets exist in the data).
      The comparison that would show whether a model scores better on transcripts it wrote itself needs both sets. Re-run the other set and rebuild; this panel then shows each pipeline's score on both sets side by side, with the paired difference.</div>`;
  }
  const [a, b] = ss, A = CACHE[a] ||= buildScope(a), Bs = CACHE[b] ||= buildScope(b);
  const keys = A.keys.filter(k => Bs.P[k]);
  return `<div class="scroll tall"><table class="t compact"><tr><th>Pipeline</th><th class="num">${esc(D.sets[a].label)}</th><th class="num">${esc(D.sets[b].label)}</th><th class="num">Gap</th></tr>
    ${keys.sort((x, y) => Bs.P[y].dr - Bs.P[x].dr).map(k => `<tr><td>${pipeCell(k)}</td><td class="num">${pct(A.P[k].dr)} ${ciTxt(A.P[k].ci)}</td><td class="num">${pct(Bs.P[k].dr)} ${ciTxt(Bs.P[k].ci)}</td><td class="num">${pts(Bs.P[k].dr - A.P[k].dr)}</td></tr>`).join("")}</table></div>`;
}
</script>
<script>
/* ============================================================== shared job helpers */
const GOLDV = (g, fk) => fk === "owner" || fk === "component" || fk === "site" ? g[fk].id : g[fk];
function showV(fk, v) {
  if (v == null || v === "") return `<span class="soft">none</span>`;
  if (fk === "owner" || fk === "component" || fk === "site") return `${esc(nm(v))} <code class="soft">${esc(v)}</code>`;
  if (fk === "due_date") return esc(fmtDate(v));
  if (fk === "priority") return "P" + esc(v);
  return esc(v);
}
function outcome(s, m, k, g) {
  const rec = D.sets[s]?.pipelines[m.id]?.[k]; if (!rec) return null;
  const pair = rec.pairs.find(q => q.gold === g.id);
  if (!pair) return { status: "missed", rec };
  const ex = k.split("|")[0];
  return { status: pair.scores.all_fields === 1 ? "ready" : "partial", pair, pred: rec.preds[pair.pred], task: D.sets[s].extractions[m.id]?.[ex]?.tasks[pair.pred], rec };
}
const STATUS = { ready: ["ok", "✓ dashboard-ready"], partial: ["warn", "found, field wrong"], missed: ["bad", "✗ missed"] };
const stChip = o => o ? `<span class="chip ${STATUS[o.status][0]}">${STATUS[o.status][1]}</span>` : `<span class="chip">not run</span>`;
const mtag = (id, extra = "") => `<a data-open="${id}" class="mono" title="Open this meeting in the data explorer"${extra}>${esc(id)}</a>`;

/* ============================================================== COMPARE */
function renderCompare() {
  const sc = SC(), ord = [...sc.list].sort((a, b) => b.dr - a.dr);
  if (!sc.P[S.A]) S.A = sc.rec.k; if (!sc.P[S.B] || S.B === S.A) S.B = (S.A === sc.base.k ? sc.best : sc.base).k;
  const A = sc.P[S.A], Bp = sc.P[S.B], d = { d: A.dr - Bp.dr, ...sc.diff(A, Bp) };
  const opt = sel => ord.map(p => `<option value="${esc(p.k)}" ${p.k === sel ? "selected" : ""}>${esc(pName(p.k))} · ${pct(p.dr)}</option>`).join("");
  const q = { both: 0, a: 0, b: 0, none: 0 }, jobs = [];
  sc.units.forEach(u => u.m.gold.forEach(g => { const oa = outcome(u.s, u.m, S.A, g), ob = outcome(u.s, u.m, S.B, g);
    const ra = oa?.status === "ready", rb = ob?.status === "ready"; q[ra && rb ? "both" : ra ? "a" : rb ? "b" : "none"]++;
    const anyDiff = ra !== rb || oa?.status !== ob?.status || FIELDS.some(([fk]) => oa?.pred?.[fk] !== ob?.pred?.[fk]);
    if (S.cmp === "all" || (S.cmp === "ready" && ra !== rb) || (S.cmp === "any" && anyDiff)) jobs.push({ u, g, oa, ob }); }));
  const verdict = d.lo > 0 ? `<b>A is better</b>: the whole interval is above zero.` : d.hi < 0 ? `<b>B is better</b>: the whole interval is below zero.` : `<b>Can't tell them apart</b> on this data: the interval includes zero.`;
  const cellAB = (o, fk, g) => { if (!o || o.status === "missed") return `<span class="soft">–</span>`; const ok = o.pair.scores[fk] === 1;
    return `<span class="${ok ? "v-ok" : "v-bad"}">${ok ? "✓" : "✗"}</span> ${showV(fk, o.pred?.[fk])}`; };
  return `<div class="eyebrow">Compare two pipelines</div><h1>Job by job: where does A beat B?</h1>
  <p class="lede">Both pipelines run on the same real jobs, so the comparison is paired: only jobs where they disagree tell you anything. This works like side-by-side run comparison in eval tools.</p>
  <div class="grid g2" style="margin:14px 0"><label class="small"><b>A</b> <select id="selA">${opt(S.A)}</select></label><label class="small"><b>B</b> <select id="selB">${opt(S.B)}</select></label></div>
  <div class="grid g4">
    <div class="card kpi"><div class="lbl">A · dashboard-ready</div><div class="big">${pct(A.dr)}</div>${ciTxt(A.ci)}<div class="tiny soft">${usd(A.cost)} · ${sec(A.secs)} per meeting</div></div>
    <div class="card kpi"><div class="lbl">B · dashboard-ready</div><div class="big">${pct(Bp.dr)}</div>${ciTxt(Bp.ci)}<div class="tiny soft">${usd(Bp.cost)} · ${sec(Bp.secs)} per meeting</div></div>
    <div class="card kpi"><div class="lbl">A − B (paired)</div><div class="big">${pts(d.d)}</div><span class="ci">95% interval ${pts(d.lo)} to ${pts(d.hi)}</span><div class="tiny soft" style="margin-top:4px">${verdict}</div></div>
    <div class="card kpi"><div class="lbl">Agreement on ${sc.gold} jobs</div><table class="t compact" style="margin-top:6px"><tr><td></td><td class="num tiny soft">B ready</td><td class="num tiny soft">B not</td></tr>
      <tr><td class="tiny soft">A ready</td><td class="num">${q.both}</td><td class="num"><b class="v-ok">${q.a}</b></td></tr><tr><td class="tiny soft">A not</td><td class="num"><b class="v-bad">${q.b}</b></td><td class="num">${q.none}</td></tr></table></div></div>
  <div class="section"><div class="sh"><h2>Field by field</h2><span class="soft small">% of all ${sc.gold} real jobs with this field right (missed jobs count as wrong)</span></div>
    <div class="card"><table class="t compact"><tr><th></th><th class="num">Found</th>${FIELDS.map(([, l]) => `<th class="num">${l}</th>`).join("")}<th class="num">All six</th></tr>
      ${[["A", A], ["B", Bp]].map(([l, p]) => `<tr><td><b>${l}</b></td><td class="num">${pct(p.tp / p.gold)}</td>${FIELDS.map(([fk]) => `<td class="num">${pct(p.fields[fk] / p.gold)}</td>`).join("")}<td class="num"><b>${pct(p.dr)}</b></td></tr>`).join("")}
      <tr><td class="soft">A − B</td><td class="num soft">${pts((A.tp - Bp.tp) / A.gold)}</td>${FIELDS.map(([fk]) => `<td class="num soft">${pts((A.fields[fk] - Bp.fields[fk]) / A.gold)}</td>`).join("")}<td class="num"><b>${pts(d.d)}</b></td></tr></table></div></div>
  <div class="section"><div class="sh"><h2>The jobs behind the difference</h2>
    <div class="seg">${[["ready", "Dashboard-ready differs"], ["any", "Any output differs"], ["all", "All jobs"]].map(([k, l]) => `<button data-cmpf="${k}" class="${S.cmp === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <span class="soft small">${jobs.length} jobs · click a meeting ID to see the transcript</span></div>
    <div class="scroll" style="max-height:700px"><table class="t compact"><tr><th>Meeting</th><th>Real job (answer key)</th><th>A</th><th>B</th>${FIELDS.map(([, l]) => `<th>${l}</th>`).join("")}</tr>
      ${jobs.map(({ u, g, oa, ob }) => `<tr><td>${mtag(u.m.id, ` data-p="${esc(S.A)}" data-f="${g.id}"`)} <span class="tid">${tnum(g.id)}</span><div><a class="tiny" data-drawer="${u.m.id}" data-f="${g.id}">transcript</a></div></td><td style="min-width:200px"><b class="small">${esc(g.summary)}</b></td><td>${stChip(oa)}</td><td>${stChip(ob)}</td>
        ${FIELDS.map(([fk]) => `<td class="small" style="min-width:120px"><div class="tiny soft">key: ${showV(fk, GOLDV(g, fk))}</div><div><b class="tiny">A</b> ${cellAB(oa, fk, g)}</div><div><b class="tiny">B</b> ${cellAB(ob, fk, g)}</div></td>`).join("")}</tr>`).join("")
        || `<tr><td colspan="10" class="muted">No jobs match this filter.</td></tr>`}</table></div></div>`;
}

/* ============================================================== DATA EXPLORER */
function renderExplore() { const m = S.mid && D.meetings.find(x => x.id === S.mid); return m ? meetingView(m) : datasetView(); }
function datasetView() {
  const q = S.dsQ.toLowerCase(), groups = [...new Set(D.meetings.map(m => m.set))];
  const rows = D.meetings.filter(m => (S.dsWriter === "all" || m.set === S.dsWriter) && (S.dsSplit === "all" || m.split === S.dsSplit)
    && (!q || m.id.includes(q) || m.gold.some(g => (g.summary + " " + (g.component.text || "") + " " + (g.owner.text || "")).toLowerCase().includes(q))));
  const card = s => { const ms = D.meetings.filter(m => m.set === s), w = ms[0].writer, g = D.generation[w] || {}, scored = !!D.sets[s];
    const first = ms.filter(m => (m.notes[0] || "").includes("attempt 1")).length;
    return `<div class="card"><div class="row"><b>${esc(setLabel(s))}</b>${scored ? `<span class="chip ok">scored in this export</span>` : `<span class="chip warn">not scored in this export</span>`}</div>
      <dl class="kv" style="margin-top:8px"><dt>Writer</dt><dd>${esc(modelOf(w).name)} · Foundry ${esc(modelOf(w).res)}</dd><dt>Meetings</dt><dd>${ms.length} · ${ms.filter(m => m.split === "train").length} train / ${ms.filter(m => m.split === "test").length} test</dd>
        <dt>Real jobs</dt><dd>${sum(ms.map(m => m.gold.length))} · plus ${sum(ms.map(m => m.distractors.length))} decoys</dd><dt>Validation</dt><dd>${first}/${ms.length} passed first attempt</dd>
        <dt>Writing cost</dt><dd>${g.cost != null ? usd(g.cost) : "–"}</dd></dl></div>`; };
  return `<div class="eyebrow">Data explorer</div><h1>Every meeting: the raw transcript, the answer key and what each pipeline extracted</h1>
  <p class="lede">Pick a meeting to see the transcript next to its answer key. For scored test meetings, choose any pipeline to see the words it pulled out, the IDs it matched and every field it got right or wrong.</p>
  <div class="grid g${Math.min(groups.length, 3)}" style="margin:16px 0">${groups.map(card).join("")}</div>
  <div class="row" style="margin-bottom:10px"><div class="seg">${[["all", "All writers"], ...groups.map(s => [s, setLabel(s)])].map(([k, l]) => `<button data-dsw="${k}" class="${S.dsWriter === k ? "on" : ""}">${esc(l)}</button>`).join("")}</div>

  ${pl ? `<div class="card" style="margin-bottom:14px"><div class="row"><label class="small"><b>Pipeline</b> <select id="selP">${keys.map(kk => `<option value="${esc(kk)}" ${kk === k ? "selected" : ""}>${esc(pName(kk))}${sc.P[kk] ? " · " + pct(sc.P[kk].dr) + " overall" : ""}</option>`).join("")}</select></label>
      <span class="small"><b>${nReady}/${m.gold.length}</b> dashboard-ready · ${rec.pairs.length} found · ${fps.length} not real · ${sec(rec.seconds)} · ${usd(rec.cost)}</span>${x?.error ? `<span class="chip bad">call failed: ${esc(x.error.slice(0, 80))}</span>` : ""}
      <button class="btn small" data-cmp="${esc(k)}" data-cmpb="${esc((k === sc.base.k ? sc.best : sc.base).k)}">Compare this pipeline</button></div>
    <details class="fold" style="margin-top:10px"><summary><b>Exactly what the extractor received</b> <span class="soft small">· ${esc(exName(ex))}</span></summary><div class="inner">${promptFor(m, ex)}</div></details></div>`
    : `<div class="callout" style="margin-bottom:14px">${m.split === "train" ? "Training meeting: used only to fine-tune gliner2.5-base-v1 and train the TF-IDF + logistic regression matcher, never scored." : "This test meeting's writer set is not scored in this export."} Only the transcript and answer key are shown.</div>`}
  <div class="xsplit"><div class="sticky"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Raw transcript</h2><span class="spacer"></span>
      <div class="seg"><button data-jobs="0" class="${S.onlyJobs ? "" : "on"}">All turns</button><button data-jobs="1" class="${S.onlyJobs ? "on" : ""}">Job turns only</button></div></div>
      <div class="transcript" id="transcript">${turns}</div>
      <div class="legend"><span><i style="background:var(--ok-soft)"></i>turn states a real job (T#)</span><span><i style="background:var(--warn-soft)"></i>decoy</span>${pl ? `<span><span class="tid x">#n</span> extracted & paired</span><span><span class="tid fp">#n</span> extracted, not a real job</span>` : ""}</div></div>

  $$(".turn", tr).forEach(t => { t.classList.toggle("focus", hits.includes(t)); t.classList.toggle("dim", !!S.focus && !hits.includes(t)); });

<script>
/* ============================================================== METHOD */
function renderMethod() {
  const sc = SC(), b = sc.best, naive = 1.96 * Math.sqrt(b.dr * (1 - b.dr) / sc.gold);
  const exs = [...new Set(sc.keys.map(k => k.split("|")[0]))], nos = [...new Set(sc.keys.map(k => k.split("|")[1]))];
  const card = (t, body) => `<div class="card"><h3>${t}</h3><div class="small muted">${body}</div></div>`;
  return `<div class="eyebrow">Method · design document</div><h1>How the experiment was designed and how every number is computed</h1>
  <p class="lede">This section follows the structure of an experiment design doc: what was tested, on what, how success is measured and what could make the result wrong.</p>
  <div class="grid g3" style="margin-top:16px">
    ${card("Question", "Which extract → match pipeline gives the highest share of stand-up jobs that can go on the dashboard with no human fix, at acceptable cost and latency?")}
    ${card("Hypotheses", "H1: LLM pipelines beat the $0 local baseline. H2: two steps (extract the words, then match) beat one call that does both. H3: unseen nicknames are the main source of matching errors.")}
    ${card("Unit and sample", `Unit of analysis: real job. Unit of resampling: meeting. This scope: ${sc.meetings} test meetings, ${sc.gold} jobs, ${sc.keys.length} pipelines. Training meetings (${D.train_count}) are never scored.`)}
    ${card("Primary metric", "<b>Dashboard-ready</b> = real jobs found with all six fields right ÷ all real jobs.")}
    ${card("Secondary metrics", "Job precision, recall and F1; accuracy per field; matching-only accuracy on known vs unseen nicknames.")}
    ${card("Guardrails", "Cost per meeting (tokens × list price), latency per meeting, failed calls (scored as found nothing). Baseline: " + esc(pName(sc.base.k)) + ".")}
  </div>
  <div class="section"><div class="sh"><h2>Pipeline</h2></div><div class="grid g4">
    ${[["A · Data", "Python samples an answer key (5–9 jobs, nicknames, deadlines, decoys). An LLM writes the Teams transcript around it and Python validates it (max 3 attempts)."],
       ["B · Extract", "Regex, GLiNER 2.5 variants or an LLM return each job with the words as said, plus the quote it came from."],
       ["C · Match", "Words become official IDs via alias lookup, fuzzy match, embeddings, a trained classifier, GLiNER or an LLM choosing from a shortlist. Dates are resolved in code."],
       ["D · Score", "Returned jobs are paired one-to-one with real jobs, then six fields are checked against the answer key."]].map(([t, x]) => card(t, x)).join("")}</div></div>
  <div class="section"><div class="sh"><h2>Scoring rules</h2></div><div class="grid g2">
    ${card("1 · Pairing", "Hungarian assignment per meeting on a similarity score, minimum 0.45: quote lands on the job’s turns ±1 (50%), summary wording overlap (30%), same equipment or its parent (10%), same owner (10%). Unpaired returned jobs are <b>not real jobs</b>; unpaired real jobs are <b>missed</b>.")}
    ${card("2 · Six fields", "Owner, equipment and site: exact ID, or correctly empty. Due date: resolved date equals the key. Priority: P1–P3, and P2 if nothing was said. Category: operations / safety / organisation. The parent asset earns half credit in a separate hierarchy column only.")}</div></div>
  <div class="section"><div class="sh"><h2>Statistics</h2></div><div class="grid g2">
    ${card("Intervals", `95% percentile intervals from ${B_REPS.toLocaleString()} bootstrap resamples of <b>meetings</b>, stratified by test set. Jobs in the same meeting share a transcript and writer, so they are not independent. Resampling whole meetings respects that structure, where the old per-job formula assumes every job is independent.`)}
    ${card("Paired differences", "Every pipeline is scored on the same resampled meetings, so the gap between two pipelines has its own interval. That is tighter and more honest than checking whether two separate ± margins overlap.")}
    ${card("Groups and the recommendation", `Each pipeline gets two paired comparisons: one against the top-scoring pipeline (#1) and one against the baseline (${esc(pName(sc.base.k))}, called "regex" in verdicts). <b>Close to #1</b>: the gap to #1 includes 0. <b>Behind #1, beats regex</b>: clearly behind #1 and clearly above the baseline. <b>No better than regex</b>: clearly behind #1, and the gap to the baseline includes 0. <b>Worse than regex</b>: clearly below the baseline. Failing to separate two pipelines is not evidence that they are equal, so groups are not used to recommend. <b>Recommendation</b>: the highest point estimate. Cost is never optimised automatically. The Summary lists the cost–quality frontier, with what each cheaper option gives up in points, jobs a year and dollars a year, so the trade-off is an explicit decision.`)}
    ${card("What this changes here", `For the best pipeline (${pct(b.dr)}), the old per-job margin is ±${Math.round(naive * 100)} pts (${Math.round(naive * 200)} pts wide). The meeting bootstrap gives ${pct(b.ci.lo)}–${pct(b.ci.hi)} (${Math.round((b.ci.hi - b.ci.lo) * 100)} pts wide). The bigger gain is the <b>paired</b> gap between pipelines. Caution: with only ${sc.meetings} meetings, a percentile bootstrap tends to be too narrow. Scoring ${sc.meetings < 20 ? "at least 20–30" : "more"} meetings is the most effective way to make the ranking trustworthy.`)}</div></div>
  <div class="section"><div class="sh"><h2>Validity</h2></div><div class="grid g2">
    ${card("Leakage controls", "Held-out nicknames appear only in test meetings; no prompt, vocabulary, training step or calibration sees them. The answer key is written before the transcript, so the truth is exact. Test meetings never feed training.")}
    ${card("Threats to validity", `Synthetic transcripts are cleaner than real ones. The transcript writer may favour its own model family (needs both writer sets). Only ${sc.meetings} meetings are scored in this scope. Fine-tuning was one CPU run with no tuning. Prices are list prices at run time.`)}</div></div>
  <div class="section"><div class="sh"><h2>Coverage: which combinations were run</h2><span class="soft small">rows = extractor, columns = matcher · blank = not run by design</span></div>
    <div class="card scroll"><table class="t compact"><tr><th></th>${nos.map(n => `<th class="num" style="white-space:normal;max-width:90px">${esc(noName(n))}</th>`).join("")}</tr>
      ${exs.map(e => `<tr><td><b>${esc(exName(e))}</b></td>${nos.map(n => { const p = sc.P[e + "|" + n]; return `<td>${p ? heat(p.dr) : ""}</td>`; }).join("")}</tr>`).join("")}</table></div></div>
  <div class="section"><div class="sh"><h2>Glossary</h2></div><div class="card"><dl class="kv">
    <dt>Job</dt><dd>One action someone commits to or is asked to do in the stand-up (the code calls it a task).</dd>
    <dt>Extractor</dt><dd>Finds jobs and returns the words as spoken.</dd><dt>Matcher</dt><dd>Turns those words into official IDs (the code calls it a normaliser).</dd>
    <dt>Pipeline</dt><dd>One extractor followed by one matcher.</dd><dt>Equipment</dt><dd>An asset in the plant hierarchy (the code calls it a component).</dd>
    <dt>Unseen nickname</dt><dd>A held-out alias that appears only in test meetings.</dd><dt>Dashboard-ready</dt><dd>Found, with all six fields right.</dd>
    <dt>Decoy</dt><dd>A sentence that sounds like a job but is not one (status update, past work, chit-chat).</dd></dl></div></div>`;
}

function renderAppendix() {

  const used = new Set(SETS().flatMap(s => D.sets[s].leaderboard.flatMap(r => [r.extractor, r.normaliser])).map(x => x.split("@")[1]).filter(Boolean));
  return `<div class="eyebrow">Appendix</div><h1>Reference material</h1>
  <p class="lede">Vocabulary, models, prompts and costs. The original slide deck is still at <a href="../v1-deck/index.html">docs/02-walkthrough/v1-deck/index.html</a>.</p>
  <div class="section"><div class="sh"><h2>Business vocabulary · ${esc(D.plant.name)}</h2><span class="soft small"><span class="chip">known nickname</span> <span class="chip held">unseen nickname (test only)</span></span></div>
    <div class="grid g2"><div class="card"><h3>People</h3><table class="t compact">${o.people.map(p => `<tr><td><b>${esc(p.name)}</b> <code class="soft">${p.id}</code><div class="tiny soft">${esc(p.role || "")}</div></td><td>${chips(p.aliases, p.heldout)}</td></tr>`).join("")}</table>
      <h3 style="margin-top:14px">Sites</h3><table class="t compact">${o.sites.map(s => `<tr><td><b>${esc(s.name)}</b> <code class="soft">${s.id}</code></td><td>${chips(s.aliases, s.heldout)}</td></tr>`).join("")}</table>
      <h3 style="margin-top:14px">Categories & priorities</h3>${o.categories.map(c => `<div class="small"><span class="chip solid">${c.id}</span> ${esc(c.description)}</div>`).join("")}${o.priorities.map(p => `<div class="small" style="margin-top:4px"><span class="chip solid">P${p.id}</span> ${esc(p.description)}</div>`).join("")}</div>
      <div class="card"><h3>Equipment hierarchy · ${o.assets.length} assets</h3><div class="scroll" style="max-height:640px"><ul class="tree">${(kids._ || []).map(node).join("")}</ul></div></div></div></div>
  <div class="section"><div class="sh"><h2>Models</h2><span class="soft small">configured in data/models.yaml · <b>bold</b> = used by a pipeline in this export</span></div>
    <div class="card scroll"><table class="t compact"><tr><th>Model</th><th>Vendor</th><th>Deployment</th><th>API</th><th class="num">Timeout</th><th class="num">$ in / out per 1M</th></tr>
      ${D.models.map(m => `<tr><td>${used.has(m.id) ? `<b>${esc(modelOf(m.id).name)}</b>` : `<span class="soft">${esc(modelOf(m.id).name)}</span>`}</td><td>${esc(modelOf(m.id).vendor)}</td><td><code>${esc(modelOf(m.id).res)}</code> · <code>${esc(m.deployment)}</code></td>
        <td class="small">${m.api === "responses" ? "Responses, strict schema" : "Chat Completions, JSON mode"}</td><td class="num">${m.timeout} s</td><td class="num">${m.price ? "$" + m.price[0] + " / $" + m.price[1] : "–"}</td></tr>`).join("")}
      ${D.embeddings.map(e => `<tr><td><b>${esc(e.id)}</b></td><td>OpenAI</td><td><code>${esc(e.deployment)}</code></td><td class="small">Embeddings · ${e.dimensions} dims</td><td></td><td class="num">$${e.price} / –</td></tr>`).join("")}</table></div></div>
  <div class="section"><div class="sh"><h2>One-off costs</h2></div><div class="card"><table class="t compact"><tr><th>Item</th><th class="num">Calls</th><th class="num">Tokens in / out</th><th class="num">Cost</th></tr>
    ${Object.entries(D.generation).map(([w, v]) => `<tr><td>Writing transcripts · ${esc(modelOf(w).name)}</td><td class="num">${v.calls}</td><td class="num">${v.input_tokens.toLocaleString()} / ${v.output_tokens.toLocaleString()}</td><td class="num">${usd(v.cost)}</td></tr>`).join("")}
    <tr><td>Embeddings · ${esc(D.embedding_usage.model)} (${D.embedding_usage.vectors} cached vectors)</td><td class="num">${D.embedding_usage.calls}</td><td class="num">${(D.embedding_usage.tokens || 0).toLocaleString()}</td><td class="num">${usd(D.embedding_usage.cost)}</td></tr></table></div></div>
  <div class="section"><div class="sh"><h2>Prompts and output schemas</h2></div>
    ${prompt("Transcript writer", D.prompts.writer)}${prompt("LLM extract (words as said)", D.prompts.extract)}${prompt("LLM one call (vocabulary in prompt)", D.prompts.direct)}${prompt("LLM match (choose from shortlist)", D.prompts.match)}</div>
  <div class="section"><div class="sh"><h2>Export</h2></div><p class="small muted">Generated ${esc(D.generated)} · ${D.meetings.length} meetings · ${SETS().length} scored test set${SETS().length > 1 ? "s" : ""}: ${SETS().map(s => `${esc(D.sets[s].label)} (${D.sets[s].meta.meetings} meetings, run <code>${esc(String(D.sets[s].meta.run_dir || "").split(/[\\/]/).pop())}</code>)`).join(", ")}.</p></div>`;
}

/* ============================================================== transcript drawer */
const DR = { mid: null, only: false, focus: null, from: null };
function drawerHTML() {
  const m = D.meetings.find(z => z.id === DR.mid); if (!m) return "";
  const byTurn = {}; m.gold.forEach(g => g.evidence.forEach(i => (byTurn[i] ||= []).push(g.id)));
  const decoy = new Set(m.turns.map((t, i) => m.distractors.some(d => d.sid === t.sid && (t.text.includes(d.text) || d.text.includes(t.text))) ? i : -1).filter(i => i >= 0));
  const turns = m.turns.map((t, i) => { const gs = byTurn[i] || [];
    if (DR.only && !gs.length) return "";
    return `<div class="turn ${gs.length ? "gold" : decoy.has(i) ? "decoy" : ""}" data-turn="${i}" data-gold="${gs.join(" ")}">
      <span class="ts">${String(Math.floor(t.t / 60)).padStart(2, "0")}:${String(t.t % 60).padStart(2, "0")}</span>
      <div><div class="who">${esc(t.who)}<small>turn ${i}</small> ${gs.map(g => `<span class="tid">${tnum(g)}</span>`).join(" ")}${decoy.has(i) ? ` <span class="chip warn" style="height:17px">decoy</span>` : ""}</div><div>${esc(t.text)}</div></div></div>`; }).join("");
  return `<div class="dh"><div class="row"><h2 id="drawerTitle" class="mono" style="margin:0">${m.id}</h2><span class="soft small">${fmtDate(m.date)} · ${m.turns.length} turns · ${m.gold.length} real jobs</span>
      <span class="spacer"></span><button class="btn small" data-dclose aria-label="Close transcript">✕</button></div>
    <div class="row" style="margin-top:6px"><span class="chip ${m.split === "test" ? "acc" : ""}">${m.split}</span><span class="chip">written by ${esc(modelOf(m.writer).name)}</span>
      <div class="seg" style="margin-left:auto"><button data-donly="0" class="${DR.only ? "" : "on"}">All turns</button><button data-donly="1" class="${DR.only ? "on" : ""}">Job turns only</button></div></div>
    <div class="jobchips">${m.gold.map(g => `<button data-dfocus="${g.id}" class="${DR.focus === g.id ? "on" : ""}" title="Highlight the turns for this job"><span class="tid">${tnum(g.id)}</span> ${esc(g.summary)}</button>`).join("")}</div></div>
  <div class="db" id="dtranscript">${turns}</div>
  <div class="df"><span class="legend" style="margin:0"><span><i style="background:var(--ok-soft)"></i>states a real job</span><span><i style="background:var(--warn-soft)"></i>decoy</span></span>
    <span class="spacer"></span><button class="btn small primary" data-open="${m.id}" data-dclose-nav>Open full meeting view →</button></div>`;
}
function drawerFocus(scroll = true) {
  const box = $("#dtranscript"); if (!box) return;
  $$(".jobchips button", $("#drawer")).forEach(b => b.classList.toggle("on", b.dataset.dfocus === DR.focus));
  const hits = $$(".turn", box).filter(el => DR.focus && el.dataset.gold.split(" ").includes(DR.focus));
  $$(".turn", box).forEach(el => { el.classList.toggle("focus", hits.includes(el)); el.classList.toggle("dim", !!DR.focus && !hits.includes(el)); });
  if (scroll && hits[0]) box.scrollTo({ top: hits[0].offsetTop - 40, behavior: "smooth" });
}
function openDrawer(mid, focus, from) {
  Object.assign(DR, { mid, focus: focus || null, from: from || null });
  const d = $("#drawer"); d.innerHTML = drawerHTML(); d.classList.add("open"); d.setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("open"); document.body.style.overflow = "hidden";
  $("[data-dclose]", d).focus(); requestAnimationFrame(() => drawerFocus());
}
function closeDrawer() {
  const d = $("#drawer"); if (!d.classList.contains("open")) return;
  d.classList.remove("open"); d.setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("open"); document.body.style.overflow = "";
  DR.from?.focus?.(); DR.mid = null;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
$("#scrim").addEventListener("click", closeDrawer);

/* ============================================================== router */
const VIEWS = { summary: renderSummary, results: renderResults, compare: renderCompare, explore: renderExplore, method: renderMethod, appendix: renderAppendix };
function writeHash(push) {
  const p = new URLSearchParams({ tab: S.tab });
  if (S.scope !== SETS()[0] || SETS().length > 1) p.set("scope", S.scope);
  if (S.tab === "compare") { p.set("a", S.A || ""); p.set("b", S.B || ""); }
  if (S.tab === "explore" && S.mid) { p.set("m", S.mid); if (S.pipe) p.set("p", S.pipe); if (S.focus) p.set("f", S.focus); }
  const h = "#" + p.toString(); if (h !== location.hash) history[push ? "pushState" : "replaceState"](null, "", h);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (VIEWS[p.get("tab")]) S.tab = p.get("tab");
  const sc = p.get("scope"); if (sc && (sc === "pooled" || D.sets[sc])) S.scope = sc;
  if (p.get("a")) S.A = p.get("a"); if (p.get("b")) S.B = p.get("b");
  S.mid = p.get("m"); if (p.get("p")) S.pipe = p.get("p"); S.focus = p.get("f");
}
function render({ push = false, keepScroll = false } = {}) {
  const sc = SC(), y = window.scrollY;
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}">${l}</button>`).join("");
  const opts = [...(SETS().length > 1 ? [["pooled", "All test sets, pooled"]] : []), ...SETS().map(s => [s, `${D.sets[s].label} test set`])];
  $("#scopebar").innerHTML = `<span class="soft">Scope</span> <select id="scope">${opts.map(([k, l]) => `<option value="${k}" ${k === S.scope ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
    <span><b>${sc.meetings}</b> meetings · <b>${sc.gold}</b> real jobs · <b>${sc.list.length}</b> pipelines</span><span class="spacer"></span>
    <span class="soft" title="Primary metric">Dashboard-ready = real jobs found with all six fields right ÷ all real jobs · intervals are 95%, meeting bootstrap</span>`;
  try { $("#main").innerHTML = VIEWS[S.tab](); } catch (e) { console.error(e); $("#main").innerHTML = `<p class="v-bad">This view could not render: ${esc(e.message)}</p>`; }
  window.scrollTo(0, keepScroll ? y : 0);
  if (S.tab === "explore" && S.focus) applyFocus();
  writeHash(push);
}
const go = (tab, extra = {}) => { Object.assign(S, extra, { tab }); render({ push: true }); };
document.addEventListener("click", e => {
  const dt = e.target.closest("[data-drawer],[data-dclose],[data-donly],[data-dfocus]");
  if (dt) { e.preventDefault(); e.stopPropagation(); const d = dt.dataset;
    if (d.drawer) return openDrawer(d.drawer, d.f, dt);
    if (d.dclose !== undefined) return closeDrawer();
    if (d.donly) { DR.only = d.donly === "1"; $("#drawer").innerHTML = drawerHTML(); return drawerFocus(false); }
    if (d.dfocus) { DR.focus = DR.focus === d.dfocus ? null : d.dfocus; return drawerFocus(); } }
  if (e.target.closest("[data-dclose-nav]")) closeDrawer();
  const t = e.target.closest("[data-tab],[data-go],[data-cmp],[data-fam],[data-sort],[data-cmpf],[data-open],[data-back],[data-dsw],[data-dss],[data-jobs],[data-focus],[data-xfocus],#theme");
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (t.id === "theme") { const h = document.documentElement; h.dataset.theme = h.dataset.theme === "dark" ? "light" : "dark"; return; }
  if (d.tab) return go(d.tab);
  if (d.go) return go(d.go, d.go === "explore" ? { mid: null } : {});
  if (d.cmp) return go("compare", { A: d.cmp, B: d.cmpb });
  if (d.fam) { S.fam = d.fam; return render({ keepScroll: true }); }
  if (d.sort) { S.sort = S.sort.k === d.sort ? { k: d.sort, asc: !S.sort.asc } : { k: d.sort, asc: d.sort === "name" || d.sort === "cost" || d.sort === "secs" }; return render({ keepScroll: true }); }
  if (d.cmpf) { S.cmp = d.cmpf; return render({ keepScroll: true }); }
  if (d.open) { e.preventDefault(); return go("explore", { mid: d.open, focus: d.f || null, ...(d.p ? { pipe: d.p } : {}) }); }
  if (d.back !== undefined) return go("explore", { mid: null, focus: null });
  if (d.dsw) { S.dsWriter = d.dsw; return render({ keepScroll: true }); }
  if (d.dss) { S.dsSplit = d.dss; return render({ keepScroll: true }); }
  if (d.jobs) { S.onlyJobs = d.jobs === "1"; render({ keepScroll: true }); return applyFocus(false); }
  if (d.focus) { if (e.target.closest("details,select,a")) return; S.focus = S.focus === d.focus ? null : d.focus; applyFocus(); return writeHash(false); }
  if (d.xfocus !== undefined && d.xfocus !== "") { S.focus = null; applyFocus(false); const tr = $("#transcript"), el = $(`.turn[data-turn="${d.xfocus}"]`, tr);
    $$(".turn", tr).forEach(x => x.classList.toggle("focus", x === el)); if (el) tr.scrollTo({ top: el.offsetTop - 40, behavior: "smooth" }); }
});
document.addEventListener("change", e => {
  const id = e.target.id, v = e.target.value;
  if (id === "scope") { S.scope = v; return render({ keepScroll: true }); }
  if (id === "bar") { S.bar = Math.max(0.1, Math.min(1, (+v || 80) / 100)); return render({ keepScroll: true }); }
  if (id === "selA") { S.A = v; return render({ keepScroll: true }); }
  if (id === "selB") { S.B = v; return render({ keepScroll: true }); }
  if (id === "selP") { S.pipe = v; return render({ keepScroll: true }); }
});
let dsT = null;
document.addEventListener("input", e => {
  if (e.target.id !== "dsq") return;
  clearTimeout(dsT); dsT = setTimeout(() => { S.dsQ = e.target.value; render({ keepScroll: true }); const i = $("#dsq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 200);
});
window.addEventListener("popstate", () => { readHash(); render(); });

async function load() {
  const bytes = Uint8Array.from(atob($("#payload").textContent.trim()), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
(async () => {
  try { D = await load(); } catch (e) { $("#main").innerHTML = `<p class="v-bad">Could not load the embedded data. Build with <code>python docs/02-walkthrough/v2-report/build.py</code>.</p>`; return; }
  [...D.ontology.people, ...D.ontology.sites, ...D.ontology.assets].forEach(x => ENT[x.id] = x);
  S.scope = SETS().length > 1 ? "pooled" : SETS()[0];
  readHash();
  $("#gen").textContent = `data exported ${D.generated}`;
  render();
})();
</script>
</body>
</html>
