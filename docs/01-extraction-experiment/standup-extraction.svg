<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Stand-up extraction experiment flow</title>
  <desc id="description">Synthetic factory stand-up transcripts from two writers, GPT-5.4 and GPT-6 Astra, flow through extractors (regex, GLiNER 2.5 base, Decide, fine-tuned variants, and eleven Foundry LLMs) and matchers (alias, fuzzy, MiniLM and OpenAI embeddings, classifier, GLiNER 2.5, LLM) into a scoreboard of quality margin, cost and latency.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b33"/>
      <stop offset="1" stop-color="#102d4c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#071b33" flood-opacity=".13"/>
    </filter>
    <path id="in-a" d="M318 222 C350 222 350 150 382 150"/>
    <path id="in-b" d="M318 222 C350 222 350 222 382 222"/>
    <path id="in-c" d="M318 222 C350 222 350 294 382 294"/>
    <path id="mid-a" d="M612 150 C640 150 640 222 668 222"/>
    <path id="mid-b" d="M612 222 C640 222 640 222 668 222"/>
    <path id="mid-c" d="M612 294 C640 294 640 222 668 222"/>
    <path id="out" d="M898 222 C920 222 920 222 942 222"/>
    <style>
      .line { opacity: 0; animation: type 9s infinite; }
      .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.8s; }
      .l5 { animation-delay: 2.4s; } .l6 { animation-delay: 3.0s; }
      @keyframes type { 0% { opacity: 0; transform: translateX(-6px); } 6%, 80% { opacity: 1; transform: none; } 92%, 100% { opacity: 0; } }
      .job { animation: glow 9s infinite; }
      @keyframes glow { 0%, 30% { fill: #f3f6f9; } 40%, 85% { fill: #e8f5ed; } 100% { fill: #f3f6f9; } }
      .bar { transform-origin: left; transform-box: fill-box; animation: grow 9s infinite; }
      .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; }
      @keyframes grow { 0%, 55% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="18" fill="#f5f7fa"/>
  <path d="M0 18Q0 0 18 0h1164q18 0 18 18v74H0z" fill="url(#header)"/>
  <g fill="#fff" font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="45" font-size="27" font-weight="700">Stand-up Extraction Experiment</text>
    <text x="42" y="72" font-size="14" fill="#b6c5d7">Two transcript writers in. Dashboard-ready jobs out. Which method wins on quality ±, cost and latency?</text>
  </g>
  <g transform="translate(1085 22)" fill="none" stroke="#64b5f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="6" width="56" height="40" rx="6"/>
    <path d="M10 18h22M10 28h34M10 38h16"/>
    <path d="M38 46l6 10 6-10"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- transcript -->
    <g filter="url(#shadow)">
      <rect x="30" y="118" width="288" height="236" rx="12" fill="#fff" stroke="#bec7d3"/>
    </g>
    <text x="48" y="146" fill="#172033" font-size="15" font-weight="700">Teams transcripts</text>
    <text x="300" y="146" fill="#596579" font-size="11" text-anchor="end">GPT-5.4 + GPT-6 Astra</text>
    <g font-size="11.5">
      <g class="line l1"><text x="48" y="174" fill="#596579"><tspan font-weight="700" fill="#0f5cc0">Sarah:</tspan> Morning all, quick round.</text></g>
      <g class="line l2"><text x="48" y="198" fill="#596579"><tspan font-weight="700" fill="#5c2d91">Olu:</tspan> Anyone watch the match?</text></g>
      <g class="line l3"><text x="48" y="222" fill="#596579"><tspan font-weight="700" fill="#107c41">Grace:</tspan> Tested the long belt yesterday.</text></g>
      <g class="line l4"><rect class="job" x="42" y="232" width="268" height="40" rx="6" fill="#f3f6f9"/>
        <text x="48" y="248" fill="#172033"><tspan font-weight="700" fill="#0f5cc0">Sarah:</tspan> Dave, can you swap the filter on</text>
        <text x="48" y="264" fill="#172033">the cold unit by Thursday? Top priority.</text></g>
      <g class="line l5"><text x="48" y="292" fill="#596579"><tspan font-weight="700" fill="#f7630c">Dave:</tspan> Yep, will do.</text></g>
      <g class="line l6"><text x="48" y="316" fill="#596579"><tspan font-weight="700" fill="#5c2d91">Priya:</tspan> Still waiting on parts for GT1.</text></g>
    </g>
    <text x="48" y="340" fill="#107c41" font-size="11" font-weight="650">answer key first → writer saved</text>

    <!-- extractors -->
    <text x="497" y="118" fill="#172033" font-size="14" font-weight="700" text-anchor="middle">1 · Extract</text>
    <rect x="382" y="130" width="230" height="40" rx="8" fill="#e8f5ed" stroke="#107c41"/>
    <rect x="382" y="202" width="230" height="40" rx="8" fill="#e8daef" stroke="#5c2d91"/>
    <rect x="382" y="274" width="230" height="40" rx="8" fill="#cfe4fa" stroke="#0078d4"/>
    <text x="398" y="155" fill="#172033" font-size="13" font-weight="650">Regex rules</text>
    <text x="398" y="227" fill="#172033" font-size="13" font-weight="650">GLiNER 2.5 variants</text>
    <text x="398" y="299" fill="#172033" font-size="13" font-weight="650">11 Foundry LLMs</text>
    <text x="497" y="336" fill="#596579" font-size="11" text-anchor="middle">base · Decide · fine-tuned · schema</text>

    <!-- normalisers -->
    <text x="783" y="118" fill="#172033" font-size="14" font-weight="700" text-anchor="middle">2 · Normalise</text>
    <g filter="url(#shadow)">
      <rect x="668" y="130" width="230" height="184" rx="12" fill="#fff" stroke="#bec7d3"/>
    </g>
    <g font-size="12" font-weight="650">
      <rect x="684" y="146" width="96" height="30" rx="6" fill="#f3f6f9"/><text x="732" y="166" fill="#172033" text-anchor="middle">alias</text>
      <rect x="786" y="146" width="96" height="30" rx="6" fill="#f3f6f9"/><text x="834" y="166" fill="#172033" text-anchor="middle">fuzzy</text>
      <rect x="684" y="184" width="96" height="30" rx="6" fill="#f3f6f9"/><text x="732" y="204" fill="#172033" text-anchor="middle">MiniLM emb</text>
      <rect x="786" y="184" width="96" height="30" rx="6" fill="#f3f6f9"/><text x="834" y="204" fill="#172033" text-anchor="middle">OpenAI emb</text>
      <rect x="684" y="222" width="96" height="30" rx="6" fill="#e8daef"/><text x="732" y="242" fill="#172033" text-anchor="middle">classifier</text>
      <rect x="786" y="222" width="96" height="30" rx="6" fill="#cfe4fa"/><text x="834" y="242" fill="#172033" text-anchor="middle">GLiNER/LLM</text>
    </g>
    <text x="783" y="276" fill="#596579" font-size="11" text-anchor="middle">"the cold unit" → IM3-CHL</text>
    <text x="783" y="294" fill="#596579" font-size="11" text-anchor="middle">"Dave" → p02 · "Thursday" → 2026-01-15</text>

    <!-- scoreboard -->
    <g filter="url(#shadow)">
      <rect x="942" y="130" width="228" height="184" rx="12" fill="#fff" stroke="#bec7d3"/>
    </g>
    <text x="958" y="160" fill="#172033" font-size="15" font-weight="700">3 · Score: quality ±</text>
    <g font-size="12" font-weight="650">
      <text x="958" y="192" fill="#107c41">Quality ±</text>
      <rect x="1030" y="182" width="124" height="12" rx="6" fill="#eef1f5"/>
      <rect class="bar b1" x="1030" y="182" width="104" height="12" rx="6" fill="#107c41"/>
      <text x="958" y="226" fill="#0f5cc0">Cost</text>
      <rect x="1030" y="216" width="124" height="12" rx="6" fill="#eef1f5"/>
      <rect class="bar b2" x="1030" y="216" width="46" height="12" rx="6" fill="#0078d4"/>
      <text x="958" y="260" fill="#f7630c">Latency</text>
      <rect x="1030" y="250" width="124" height="12" rx="6" fill="#eef1f5"/>
      <rect class="bar b3" x="1030" y="250" width="70" height="12" rx="6" fill="#f7630c"/>
    </g>
    <text x="958" y="292" fill="#596579" font-size="11">dashboard-ready · cost · latency</text>

    <!-- flows -->
    <g stroke="#9aa7b8" stroke-width="2" fill="none" stroke-dasharray="4 5">
      <use href="#in-a"/><use href="#in-b"/><use href="#in-c"/>
      <use href="#mid-a"/><use href="#mid-b"/><use href="#mid-c"/><use href="#out"/>
    </g>
    <g>
      <circle r="5" fill="#107c41"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#in-a"/></animateMotion></circle>
      <circle r="5" fill="#5c2d91"><animateMotion dur="2.4s" repeatCount="indefinite" begin=".4s"><mpath href="#in-b"/></animateMotion></circle>
      <circle r="5" fill="#0078d4"><animateMotion dur="2.4s" repeatCount="indefinite" begin=".8s"><mpath href="#in-c"/></animateMotion></circle>
      <circle r="5" fill="#107c41"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#mid-a"/></animateMotion></circle>
      <circle r="5" fill="#5c2d91"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#mid-b"/></animateMotion></circle>
      <circle r="5" fill="#0078d4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="2s"><mpath href="#mid-c"/></animateMotion></circle>
      <circle r="5" fill="#f7630c"><animateMotion dur="1.2s" repeatCount="indefinite" begin=".6s"><mpath href="#out"/></animateMotion></circle>
    </g>
  </g>
</svg>

