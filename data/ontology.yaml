# Reference data ("ontology") for the fictional Riverside Works factory.
#
# This is the "known business vocabulary" that normalisers map raw mentions onto.
#
#   aliases           - nicknames the business already knows. Normalisers MAY use these.
#   heldout_aliases   - realistic nicknames that are deliberately NOT given to any
#                       normaliser. Test-split transcripts use them so we can measure
#                       whether a method generalises beyond its lookup table.
#
# Assets form a hierarchy (area -> system -> component). Linking a mention to the
# right parent when the exact component is ambiguous earns partial credit.

plant:
  name: Riverside Works
  description: >
    A mid-sized manufacturing plant making moulded plastic packaging. It runs three
    injection-moulding lines, a packing hall, and an on-site combined heat and power
    (CHP) plant with two small gas turbines, a waste-heat boiler and a site water system.

categories:
  - id: operations
    description: Running, maintaining, inspecting or repairing plant and production equipment.
  - id: safety
    description: Hazards, permits, isolations, PPE, incidents, near misses, risk assessments and compliance checks.
  - id: organisation
    description: Scheduling, staffing, training, ordering parts, contractors, site visits, paperwork and meetings.

priorities:
  - id: 1
    description: Urgent. Must happen today or is safety-critical or stops production.
  - id: 2
    description: Normal. Should happen this week.
  - id: 3
    description: Low. Nice to have, whenever there is time.

