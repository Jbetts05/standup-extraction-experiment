[project]
name = "standup-extraction-experiment"
version = "0.1.0"
description = "Compare methods for extracting and normalising tasks from synthetic factory stand-up transcripts."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "azure-identity>=1.17,<2",
    "numpy>=1.26",
    "openai>=2.0,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Local encoder models: GLiNER2 extraction/classification and embedding search.
local = [
    "gliner2[local]>=1.3",
    "protobuf>=4.25",
    "sentencepiece>=0.2",
    "sentence-transformers>=3.0",
]
# GLiNER2 fine-tuning.
train = [
    "gliner2[train]>=1.3",
]
dev = [
    "pytest>=8.0",
]
# Live local demo of the board pipeline (standup-exp board demo)
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
standup-exp = "standup_exp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standup_exp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
